services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - FLASK_DEBUG=0
      # Set your key for plagiarism check (optional):
      # - HUGGINGFACE_API_KEY=your_key_here
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

volumes:
  backend-data:
